name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stockpulse_ci?schema=public

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stockpulse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d stockpulse_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Validate release metadata
        run: npm run release:check

      - name: Run type checks, lint, and tests
        run: npm run check

      - name: Build production application
        run: npm run build

      - name: Verify credential-free demo seed is idempotent
        env:
          STOCKPULSE_DEMO_MODE: "true"
        run: |
          npm run demo:seed
          npm run demo:seed

      - name: Smoke production demo
        env:
          STOCKPULSE_DEMO_MODE: "true"
          SMOKE_PORT: "3210"
        run: npm run smoke:demo

      - name: Install pinned Chromium acceptance browser
        run: npx --yes playwright@1.62.1 install --with-deps chromium

      - name: Browser reviewer workflow
        env:
          STOCKPULSE_DEMO_MODE: "true"
          BROWSER_SMOKE_PORT: "3211"
        run: npm run browser:demo
