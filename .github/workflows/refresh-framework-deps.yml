name: Refresh framework dependencies

on:
  push:
    branches: [phase-1-foundation-hardening]
    paths:
      - .github/dependency-refresh.request

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@v6
        with:
          ref: phase-1-foundation-hardening

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Refresh patched runtime dependencies
        run: |
          npm install --save-prod --save-exact tsx@4.23.9
          npm audit fix --omit=dev || true

      - name: Inspect production dependency tree and audit
        run: |
          npm ls esbuild fast-uri deepmerge-ts prisma --omit=dev || true
          npm audit --omit=dev || true

      - name: Commit regenerated package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files already current."
          else
            git commit -m "fix(deps): refresh safe production transitive fixes"
            git push origin HEAD:phase-1-foundation-hardening
          fi
